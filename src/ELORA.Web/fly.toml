# =====================================================================
#  Конфигурация Fly.io для ELORA.
#
#  Файл читается командой `fly deploy`, запускать её нужно из этой папки
#  (здесь же лежит Dockerfile).
#
#  Порядок первого развёртывания:
#    1) fly auth login
#    2) fly launch --no-deploy          — создать приложение (перезапишет имя, если занято)
#    3) fly volumes create elora_data --size 1 --region ams
#         ↑ том под базу данных. БЕЗ него база будет жить внутри контейнера
#           и обнулится при каждом деплое.
#    4) Секреты — ДО первого запуска (см. блок ниже):
#         fly secrets set ELORA_ADMIN_LOGIN="admin" ELORA_ADMIN_PASSWORD="<свой пароль>"
#         fly secrets set NVIDIA_API_KEY="nvapi-..."
#         fly secrets set Telegram__BotToken="<токен>" Telegram__AdminBotToken="<токен>"
#    5) fly deploy
#    6) fly open                        — открыть сайт по публичной ссылке
#    7) Задать публичный адрес, иначе кнопка Mini App в Telegram не включится:
#         fly secrets set Site__PublicUrl="https://<имя>.fly.dev"
#
#  Повторные обновления: просто `fly deploy`.
#
#  ВАЖНО про пароль админки: логин и пароль администратора создаются при первом
#  запуске на ПУСТОЙ базе. Значения по умолчанию (admin / elora2026) известны
#  всем, кто читал исходники. Если задать ELORA_ADMIN_PASSWORD уже после первого
#  запуска, он не применится — придётся менять пароль в админке (раздел «Профиль»).
# =====================================================================

app = "elora"
primary_region = "ams"   # Амстердам. Ближайшие альтернативы: waw (Варшава), fra (Франкфурт)

[build]
  dockerfile = "Dockerfile"

# ---------------------------------------------------------------------
#  Переменные окружения приложения.
# ---------------------------------------------------------------------
[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # База данных лежит на постоянном томе (см. [[mounts]]), а не в файловой
  # системе контейнера — поэтому записи клиентов переживают деплои.
  Database__Path = "/data/elora.db"
  # Токен Telegram здесь НЕ указываем: секреты задаются через `fly secrets set`,
  # иначе они попадут в файл и в репозиторий.
  # Ключ AI-консультанта задаётся так же:
  #   fly secrets set NVIDIA_API_KEY=nvapi-...
  # Модель менять не обязательно — цепочка по умолчанию берётся из appsettings.json.
  # Если нужна своя, задайте её обычной переменной (через запятую, первая — самая быстрая):
  #   NVIDIA_MODELS = "nvidia/nemotron-3-super-120b-a12b,meta/muse-glimmer-30b"

# ---------------------------------------------------------------------
#  Постоянный том под базу данных.
#  Создаётся отдельной командой (см. шаг 3 выше) — этот блок только монтирует.
# ---------------------------------------------------------------------
[[mounts]]
  source = "elora_data"
  destination = "/data"

# ---------------------------------------------------------------------
#  Веб-служба: один порт наружу, HTTPS обеспечивает сам Fly.
# ---------------------------------------------------------------------
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # ВАЖНО: 1, а не 0. При остановленной машине фоновые службы не работают —
  # перестанут приходить напоминания о визитах и не будут обрабатываться
  # сообщения Telegram-бота. Если эти функции не нужны, можно поставить 0
  # и экономить: тогда машина будет просыпаться только под запросы.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Проверка работоспособности: приложение отдаёт /healthz,
  # когда база данных доступна.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
