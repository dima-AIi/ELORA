# =====================================================================
#  Blueprint для Render (файл кладётся в КОРЕНЬ Git-репозитория).
#
#  ВАЖНО про Render и .NET:
#   • .NET нет среди «родных» рантаймов Render, поэтому сборка идёт через
#     Docker — отсюда runtime: docker и путь к Dockerfile;
#   • Render разворачивает проект ИЗ Git-репозитория. Если репозитория нет,
#     сначала нужно создать его и запушить проект (GitHub / GitLab / Bitbucket);
#   • постоянный диск (disk) доступен ТОЛЬКО на платном тарифе. Без диска
#     файловая система эфемерная и база elora.db обнуляется при каждом
#     деплое и перезапуске службы.
#
#  Порядок развёртывания:
#    1) создать Git-репозиторий и запушить туда папку с решением;
#    2) в панели Render: New → Blueprint → выбрать репозиторий;
#    3) Render прочитает этот файл и создаст службу;
#    4) токен Telegram задать в панели (переменная помечена sync: false).
#
#  Альтернатива без Git — Fly.io (см. fly.toml): там деплой идёт прямо из
#  локальной папки командой `fly deploy`.
# =====================================================================

services:
  - type: web
    name: elora
    runtime: docker

    # Постоянный диск возможен только на платном тарифе.
    # free — демо без сохранения данных, starter — с диском.
    plan: starter
    region: frankfurt

    # Сборка: контекст — папка приложения, там же лежат Dockerfile и .dockerignore.
    dockerContext: ./ELORA.Web
    dockerfilePath: ./ELORA.Web/Dockerfile

    # Приложение отдаёт 200, когда база данных доступна.
    healthCheckPath: /healthz

    autoDeploy: true

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Путь к базе на смонтированном диске — иначе записи не сохранятся.
      - key: Database__Path
        value: /data/elora.db

      # Секрет: значение задаётся в панели Render и в репозиторий не попадает.
      - key: Telegram__BotToken
        sync: false

      # Ключ AI-консультанта (NVIDIA NIM). Без него секция чата на сайте
      # работает, но отвечает «консультант ещё не подключён» — не выдумывает.
      - key: NVIDIA_API_KEY
        sync: false

      # Цепочка моделей (не обязательно: по умолчанию берётся из appsettings.json).
      # Перечисляется через запятую, первой — самая быстрая.
      # - key: NVIDIA_MODELS
      #   sync: false

      # ОБЯЗАТЕЛЬНО СМЕНИТЬ. Логин и пароль администратора создаются при первом
      # запуске на пустой базе. Значения по умолчанию (admin / elora2026) известны
      # всем, кто читал исходники, — на публичном сайте это открытая дверь.
      - key: ELORA_ADMIN_LOGIN
        sync: false
      - key: ELORA_ADMIN_PASSWORD
        sync: false

      # Публичный адрес сайта. Нужен для кнопки Mini App в Telegram:
      # она включается только по HTTPS. Задать после первого деплоя,
      # когда адрес вида https://elora.onrender.com уже известен.
      - key: Site__PublicUrl
        sync: false

    # Постоянный том под базу данных.
    disk:
      name: elora_data
      mountPath: /data
      sizeGB: 1
